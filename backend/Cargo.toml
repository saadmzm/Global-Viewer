[package]
name = "global-viewer-backend"
version = "0.1.0"
edition = "2024"
authors = ["Saad Moazzam <saad.mzm65@gmail.com>"]

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["multipart"] }
image = "0.25.10"
mime = "0.3.17"
mime_guess = "2.0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "cors", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
